url: https://sulmanolieko.github.io/fracreg/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2c3e50"
    secondary: "#18bc9c"
    success: "#18bc9c"
    info: "#3498db"
    base_font:
      google: "Inter"
    heading_font:
      google: "Inter"
    code_font:
      google: "JetBrains Mono"
    border-radius: "0.5rem"
    btn-border-radius: "0.375rem"
  light-switch: true
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
  css: ["pkgdown/extra.css"]

code:
  width: 80

articles:
  - title: "Tutorials"
    navbar: ~
    contents:
      - fracreg_tutorial

home:
  title: "fracreg — Fractional Response Regressions"
  description: >
    A comprehensive R package for estimation, specification testing, and
    interpretation of one-part, two-part hurdle, and three-part double-inflated
    fractional regression models. Supports panel data (CRE, GMM, QML) and
    endogeneity correction via control function and GMM approaches.
  links:
    - text: Report a bug
      href: https://github.com/SulmanOlieko/fracreg/issues
    - text: View on GitHub
      href: https://github.com/SulmanOlieko/fracreg

navbar:
  structure:
    left: [intro, articles, reference]
    right: [search, lightswitch, github]

reference:
  - title: "Package Overview"
    desc: "General package description and help."
    contents:
      - fracreg-package
      - fracreg_k401k

  - title: "Base Fractional Estimators"
    desc: "Functions for cross-sectional, hurdle, and double-inflated models."
    contents:
      - fracreg
      - fracreg.pe

  - title: "Panel Data & Endogeneity"
    desc: "Functions for panel data, unobserved heterogeneity, and endogenous regressors."
    contents:
      - fracregpd
      - fracregpd.pe
      - fracreghet
      - fracreghet.pe

  - title: "Fractional Ridge Regression"
    desc: "Functions for applying ridge penalization to fractional regression models."
    contents:
      - fracregridge
      - fracregridge.pe

  - title: "Fractional Multinomial Logit"
    desc: "Functions for estimating fractional multinomial logit models."
    contents:
      - fracregmlogit
      - fracregmlogit.pe
      - fracreg_spending
      - summary.fracregmlogit
      - plot.fracregmlogit
      - plot.fracregmlogit.pe
      - fitted.fracregmlogit
      - wtp

  - title: "Specification Testing & Diagnostics"
    desc: "Tools for testing functional form, link specification, and non-nested models."
    contents:
      - fracreg.ggoff
      - fracreg.reset
      - fracreg.ptest
      - fracreghet.reset
